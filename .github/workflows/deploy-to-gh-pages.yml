name: Deploy to GitHub Pages

# Publishes the icon browser (npm run preview) to GitHub Pages once a release has been
# published, so the site always shows the released icons. It can also be run by hand
# from the Actions tab.
#
# It follows the Publish workflow rather than the tag itself: the github-pages
# environment only accepts deployments from the default branch, and workflow_run
# runs there while still building the released commit.
on:
  workflow_run:
    workflows: [Publish]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout source code
        uses: actions/checkout@v7
        with:
          # The released commit, not whatever main has moved on to since
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install Dependencies
        run: npm ci --ignore-scripts

      - name: Build the site
        run: npm run preview

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload the site
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
